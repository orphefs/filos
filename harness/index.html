<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same policy as the real webview (fixed nonce), plus connect-src 'self' so the mock host
         can fetch the fixture. The webview bundle itself never fetches. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-filosharness'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';"
    />
    <title>Filos webview harness</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../dist/webview.css" />
    <link rel="stylesheet" href="harness.css" />
  </head>
  <body class="vscode-light harness">
    <div class="harness-bar" role="region" aria-label="Harness controls">
      <strong class="harness-name">Filos harness</strong>
      <fieldset>
        <legend>Theme</legend>
        <button type="button" data-theme="vscode-light">Light</button>
        <button type="button" data-theme="vscode-dark">Dark</button>
        <button type="button" data-theme="vscode-high-contrast">High contrast</button>
      </fieldset>
      <fieldset>
        <legend>Width</legend>
        <button type="button" data-width="">Full</button>
        <button type="button" data-width="700">700px</button>
        <button type="button" data-width="480">480px</button>
      </fieldset>
      <fieldset>
        <legend>Host sends</legend>
        <button type="button" id="h-load">Load sample</button>
        <button type="button" id="h-load-warn">Load with warnings</button>
        <button type="button" id="h-load-agent">Load as agent</button>
        <button type="button" id="h-load-pr" title="Load straight away as a GitHub pull request review (agent, posts to acme/ledger#42)">Load as PR</button>
        <button type="button" id="h-loading">Loading</button>
        <button type="button" id="h-pr-run" title="A pull request start: steps advance with live agent progress, then the review loads">PR run (steps)</button>
        <button type="button" id="h-pr-fail" title="A pull request start whose comprehension pass fails (expired login)">PR step fails</button>
        <button type="button" id="h-error">Error (all actions)</button>
        <button type="button" id="h-error-auth">Error (auth expired)</button>
        <label>Select <select id="h-select-id" aria-label="Node to select"></select></label>
        <button type="button" id="h-select">Host select</button>
      </fieldset>
      <fieldset>
        <legend>Review (real ReviewModel)</legend>
        <button type="button" id="h-mode-fast" aria-pressed="true">Fast</button>
        <button type="button" id="h-mode-didactic" aria-pressed="false">Didactic</button>
        <button type="button" id="h-agent" aria-pressed="false" title="Agent-sourced review: open answers and threads go to the (simulated) agent">Agent</button>
        <button type="button" id="h-agent-fails" aria-pressed="false" title="Simulated agent calls fail (expired login)">Agent fails</button>
        <button type="button" id="h-target" aria-pressed="false" title="Post target: a fake GitHub PR instead of the sample's 'none'">GitHub PR</button>
        <button type="button" id="h-post-fails" aria-pressed="false" title="Simulated posting fails">Post fails</button>
        <label>Questions
          <select id="h-questions" aria-label="Questions status">
            <option value="ready">ready</option>
            <option value="loading">loading</option>
            <option value="error">error</option>
            <option value="none">none</option>
          </select>
        </label>
        <button type="button" id="h-review-reset" title="Forget answers, comments, exploration and confidence">Reset review</button>
      </fieldset>
      <button type="button" id="h-reset" title="Forget host and webview state, then reload">Reset state</button>
    </div>
    <div class="harness-stage">
      <div class="harness-frame" id="harness-frame">
        <div id="app"></div>
      </div>
    </div>
    <section class="harness-log" aria-label="Host log">
      <header>
        <strong>Host log</strong> <span class="muted">(messages the webview posted, newest last)</span>
        <button type="button" id="h-log-clear">Clear</button>
      </header>
      <ol id="host-log"></ol>
      <details id="h-export" class="harness-export" hidden>
        <summary>Exported Markdown (what the host would copy and open)</summary>
        <button type="button" id="h-export-close">Close</button>
        <pre id="h-export-text"></pre>
      </details>
    </section>
    <!-- The mock host: harness/host.ts bundled with the real ReviewModel (node esbuild.mjs). -->
    <script nonce="filosharness" src="../dist/harness-host.js"></script>
    <script nonce="filosharness" src="../dist/webview.js"></script>
  </body>
</html>
